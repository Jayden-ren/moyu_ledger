name: build-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（用于产物命名）"
        required: false
        default: "1.0.0"
      tag:
        description: "要上传到的 release tag"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Qt（自动挑选可用版本）+ MinGW 13.1
        shell: pwsh
        run: |
          python -m pip install --quiet --upgrade aqtinstall
          Write-Host "== 可用版本 =="
          python -m aqt list-qt windows desktop
          $candidates = @("6.11.1", "6.11.0", "6.10.2", "6.10.1", "6.9.3", "6.9.2", "6.8.3")
          $installed = $null
          foreach ($v in $candidates) {
            Write-Host "== 尝试安装 Qt $v =="
            python -m aqt install-qt windows desktop $v win64_mingw -O C:\Qt
            if (Test-Path "C:\Qt\$v\mingw_64\bin\qmake.exe") { $installed = $v; break }
          }
          if (-not $installed) { throw "Qt 安装失败：没有可用版本" }
          Write-Host "== 已安装 Qt $installed =="
          if ($installed -ne "6.11.1") {
            New-Item -ItemType Directory -Force -Path "C:\Qt\6.11.1" | Out-Null
            cmd /c mklink /J "C:\Qt\6.11.1\mingw_64" "C:\Qt\$installed\mingw_64"
          }
          python -m aqt install-tool windows desktop tools_mingw1310 -O C:\Qt
          & "C:\Qt\6.11.1\mingw_64\bin\qmake.exe" -query QT_VERSION

      - name: 配置与编译（Release）
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\6.11.1\mingw_64\bin;C:\Qt\Tools\mingw1310_64\bin;" + $env:PATH
          cmake -S . -B build\release -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=C:\Qt\6.11.1\mingw_64"
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }
          cmake --build build\release
          if ($LASTEXITCODE -ne 0) { throw "编译失败" }

      - name: 自检
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "C:\Qt\6.11.1\mingw_64\bin;C:\Qt\Tools\mingw1310_64\bin;" + $env:PATH
          Write-Host "== Qt 版本 =="
          & "C:\Qt\6.11.1\mingw_64\bin\qmake.exe" -query QT_VERSION
          Get-ChildItem "C:\Qt\6.11.1\mingw_64\plugins\platforms" | Select-Object -ExpandProperty Name
          Write-Host "== 运行自检 =="
          $lines = @()
          $output = & ".\build\release\MoyuLedger.exe" --self-test 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { $lines += "$_"; Write-Host $_ }
          Write-Host "== exit code = $code =="
          if ($code -ne 0) { throw "自检失败（exit=$code）" }
      - name: 打包单文件 exe
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\6.11.1\mingw_64\bin;C:\Qt\Tools\mingw1310_64\bin;" + $env:PATH
          .\packaging\build-single-exe.ps1 -Version "${{ inputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "打包失败" }
          Get-ChildItem dist | Select-Object Name, Length

      - name: 上传到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ inputs.version }}"
          $tag = "${{ inputs.tag }}"
          $src = "dist\摸鱼记账-$ver-单文件.exe"
          if (-not (Test-Path $src)) { throw "找不到单文件产物：$src" }
          $dst = "dist\moyu_ledger_windows_x64_$ver.exe"
          Copy-Item $src $dst -Force
          Get-FileHash $dst -Algorithm SHA256 | Format-List
          gh release view $tag --repo $env:GITHUB_REPOSITORY | Out-Null
          gh release upload $tag $dst --repo $env:GITHUB_REPOSITORY --clobber
          # 清理之前残留的分片资产
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name' | Where-Object { $_ -like "moyu_part_*" } | ForEach-Object {
            gh release delete-asset $tag $_ --repo $env:GITHUB_REPOSITORY -y
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets