name: assemble-release-asset
on:
  push:
    paths:
      - ".github/workflows/release-assemble.yml"
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge parts and publish single exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          ASSET="moyu_ledger_windows_x64_1.0.0.exe"
          mkdir -p parts
          gh release download "$TAG" --pattern "moyu_part_*" --dir parts
          ls -l parts
          cat $(ls parts/moyu_part_* | sort) > "$ASSET"
          ls -l "$ASSET"
          sha256sum "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber
          for f in parts/moyu_part_*; do gh release delete-asset "$TAG" "$(basename "$f")" -y || true; done
          echo "done"